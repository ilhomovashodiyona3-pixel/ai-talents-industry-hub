*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Sora,system-ui,sans-serif;line-height:1.15;margin:0}
.w{max-width:1040px;margin:0 auto;padding:0 20px}
header{background:var(--navy);color:#fff}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0;gap:12px}
nav b{font-family:Sora,sans-serif;font-size:18px}nav b i{color:var(--em);font-style:normal}
.lang button{background:none;border:1px solid #ffffff55;color:#fff;padding:4px 10px;border-radius:6px;cursor:pointer}
.lang button.on{background:var(--em);border-color:var(--em);color:#04281c}
.hero{padding:48px 0 56px;display:grid;gap:32px;grid-template-columns:1.1fr .9fr;align-items:center}
.hero h1{font-size:clamp(30px,5vw,50px)}
.hero p{color:#c4d3e8;max-width:46ch}
.btn{display:inline-block;padding:12px 20px;border-radius:8px;font-weight:500;text-decoration:none;border:1px solid transparent;cursor:pointer;font:inherit}
.p{background:var(--em);color:#04281c}.s{border-color:#ffffff66;color:#fff}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.net{width:100%;height:auto}
.net text{fill:#fff;font:12px "IBM Plex Sans",sans-serif}
.flow{stroke-dasharray:6 6;animation:d 1.2s linear infinite}
@keyframes d{to{stroke-dashoffset:-12}}
@media(prefers-reduced-motion:reduce){.flow{animation:none}}
.note{background:#fef3c7;color:#6b4a00;border-radius:8px;padding:8px 12px;font-size:14px;margin:0 0 16px}
section{padding:48px 0}section h2{font-size:clamp(24px,3.5vw,34px);margin-bottom:8px}
.sub{color:var(--mut);margin:0 0 24px;max-width:60ch}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mod{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--em);border-radius:8px;padding:14px 16px}
.mod h3{font-size:16px}.mod p{margin:4px 0 0;color:var(--mut);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;font:inherit}
.tabs button[aria-selected=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px}.kpi b{font:700 22px Sora,sans-serif;display:block}.kpi span{color:var(--mut);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--em);border-radius:4px 4px 0 0;min-width:0;transition:height .5s}
.bars div:nth-child(odd){background:var(--navy2)}
.lbl{display:flex;gap:8px;color:var(--mut);font-size:12px}.lbl span{flex:1;text-align:center}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
select,input[type=range]{font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--tx)}
.li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.li small{color:var(--mut);display:block}.li b{white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--em);background:none;color:var(--tx);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;text-align:left}
.ans{border-left:4px solid var(--em);padding:8px 14px;background:var(--bg);border-radius:0 8px 8px 0;min-height:60px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;counter-reset:s;padding:0;list-style:none}
.steps li{counter-increment:s;padding-left:44px;position:relative}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--em);color:#04281c;display:grid;place-items:center;font:700 14px Sora,sans-serif}
.cta{background:var(--navy);color:#fff;border-radius:16px;padding:36px 24px;text-align:center}
footer{padding:28px 0;color:var(--mut);font-size:14px}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--em);outline-offset:2px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.nl{display:flex;gap:18px;font-size:14px}.nl a{color:#c4d3e8;text-decoration:none}.nl a:hover{color:#fff}
.lang{display:flex;gap:4px}.lang button{padding:6px 10px;font:inherit;font-size:13px}
.hw{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding:0;margin:0;list-style:none}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.st .ic{position:relative;display:grid;place-items:center;width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:var(--em);margin-bottom:14px}
.st .ic svg{width:30px;height:30px}
.st .ic em{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--em);color:#04281c;font:700 12px Sora,sans-serif;display:grid;place-items:center}
.st h3{font-size:16px;margin-bottom:4px}.st p{margin:0;color:var(--mut);font-size:14px}
@media(max-width:760px){.nl{display:none}.li{flex-direction:column;gap:4px}}

document.getElementById('hw').innerHTML=ST.map((s,i)=>`<li class="st"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[i]}</svg><em>${i+1}</em></span><h3>${s[lg][0]}</h3><p>${s[lg][1]}</p></li>`).join('');
V[S.tab]();fm.textContent=S.fm?t(S.fm):''}
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lg=+b.dataset.l;try{localStorage.setItem('ih-lang',L[lg])}catch(e){}render()});
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-selected',x===b));S.tab=b.dataset.t;V[S.tab]()});
f.onsubmit=e=>{e.preventDefault();S.fm=/^\S+@\S+\.\S+$/.test(em.value)?'ok':'er';fm.textContent=t(S.fm)};
render();
</script></body></html>
